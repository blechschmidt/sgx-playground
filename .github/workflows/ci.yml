# Everything that runs without SGX hardware. The hardware/remote half of
# the end-to-end tests (live_* in examples/echo-client/tests/e2e.rs) runs
# against the public executor in live-integration.yml, or against any
# executor that returns a quote with scripts/e2e.sh.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No global RUSTFLAGS: they would replace the enclave target's cfgs in
  # .cargo/config.toml. Warnings are denied by clippy's -D warnings.
  # rust-toolchain.toml pins 1.100.0 (+ x86_64-unknown-none, clippy,
  # rustfmt); rustup on the runner installs it on first use.

jobs:
  test:
    name: unit and integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # The no_std enclave crates must also build for the enclave target.
      - run: cargo build --release --locked --target x86_64-unknown-none -p echo-enclave -p sealing-enclave

  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0
      - run: cargo deny --locked check

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.23.0
      # Ignores are in .cargo/audit.toml (with reasons, mirrored in deny.toml).
      - run: cargo audit --deny warnings

  reproducible-build:
    name: reproducible enclave build (two clean builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (each Nix build needs several GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build twice from scratch, the second time from another source directory
        run: |
          set -eu
          for build in a b; do
            # Retried: fetches from download.01.org occasionally fail to
            # resolve on the runners. A failed attempt leaves no output.
            for attempt in 1 2 3; do
              DOCKER_BUILDKIT=0 docker build --no-cache \
                -f containers/Dockerfile.nix-build \
                --build-arg SRC_DIR=/build-$build/src \
                -t sgx-ra-repro:$build . && break
              test "$attempt" -lt 3
              sleep 60
            done
            cid=$(docker create sgx-ra-repro:$build /nonexistent)
            docker cp "$cid:/out" "out-$build"
            docker rm "$cid"
            docker rmi sgx-ra-repro:$build
            docker builder prune -af >/dev/null
          done
      - name: Compare sha256 of enclave.signed.so and enclave.so.gendata
        run: |
          set -eu
          {
            echo '| file | build a | build b |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for f in enclave.signed.so enclave.so.gendata enclave.so MRENCLAVE.txt; do
            a=$(sha256sum "out-a/$f" | cut -d' ' -f1)
            b=$(sha256sum "out-b/$f" | cut -d' ' -f1)
            echo "| $f | \`$a\` | \`$b\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$a" != "$b" ]; then echo "::error::$f differs: $a vs $b"; status=1; fi
          done
          diff -r out-a out-b || status=1
          (cd out-a && sha256sum -c SHA256SUMS)
          exit $status
      - name: MRENCLAVE matches the value published in README.md
        run: |
          set -eu
          mrenclave=$(cat out-a/MRENCLAVE.txt)
          echo "MRENCLAVE $mrenclave" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "| \*\*MRENCLAVE\*\* | \`$mrenclave\` |" README.md \
            || { echo "::error::README.md does not publish MRENCLAVE $mrenclave; update the table"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: enclave
          path: out-a/

  e2e-offline:
    name: E2E without hardware (modified source, SGX simulation)
    needs: reproducible-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/download-artifact@v4
        with:
          name: enclave
          path: target/nix-enclave/enclave
      - uses: Swatinem/rust-cache@v2
      - name: A modified enclave source changes MRENCLAVE and the client refuses it
        env:
          SGX_RA_E2E_GENDATA: target/nix-enclave/enclave/enclave.so.gendata
        run: >
          cargo test --locked -p echo-client --test e2e --
          --ignored --exact modified_enclave_source_changes_mrenclave --nocapture
      - name: Build the SGX SDK image (blueprint) and the simulation enclave
        run: |
          set -eu
          docker builder prune -af >/dev/null
          DOCKER_BUILDKIT=0 docker build -f sgx-playground/containers/Dockerfile.build \
            --target build -t sgx-playground-server:latest sgx-playground
          cargo build --release --locked --target x86_64-unknown-none -p echo-enclave
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src sgx-playground-server:latest \
            enclave-sys/sim/build.sh --staticlib target/x86_64-unknown-none/release/libecho_enclave.a
      - name: Real enclave code (SGX simulation) - handshake, substituted key, tampered records
        run: |
          set -eu
          sim="$PWD/target/enclave/echo-enclave-sim"
          SGX_RA_SIM_HOST="docker run --rm -i -v $sim:/e sgx-playground-server:latest /e/sim_host /e/enclave.signed.so" \
          SGX_RA_SIM_MRENCLAVE=$(cat "$sim/mrenclave.hex") \
            cargo test --locked -p sgx-ra-client --test sim_enclave -- --ignored

  compose:
    name: compose file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q && docker compose --profile local-sgx config -q
      - run: bash -n scripts/e2e.sh && sh -n containers/verify-rs-entrypoint.sh
      - run: DOCKER_BUILDKIT=0 docker build -f containers/Dockerfile.verify-rs -t sgx-ra-verify-rs .
      - name: verify-rs reports a missing build
        run: |
          set +e
          docker run --rm sgx-ra-verify-rs; code=$?
          test "$code" -eq 1
