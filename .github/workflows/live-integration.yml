# Integration test against the public executor at
# sgx-playground.blechschmidt.io:443 (real SGX hardware). It runs the
# client the way a user would: rebuild the enclave in the reproducible
# Nix container, verify the executor's DCAP quote against Intel PCS (no
# API key), check that the attested report_data binds the channel key and
# exchange messages through the encrypted channel. Then the live_* tests
# put a man-in-the-middle in front of the executor and check that
# tampering is detected.
#
# The deployed enclave must be the one this commit builds: a change that
# moves MRENCLAVE (anything in the enclave or sgx-ra-core) fails here until
# the executor is redeployed (scripts/nix-build-host-image.sh on the host).
name: live integration

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SGX_RA_E2E_HOST: sgx-playground.blechschmidt.io
  SGX_RA_E2E_PORT: "443"

jobs:
  live:
    name: attest sgx-playground.blechschmidt.io and echo over the trusted channel
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (each Nix build needs several GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Use the runner's DNS resolvers in Docker builds
        # The runner's resolv.conf points at systemd-resolved's stub
        # (127.0.0.53), which BuildKit build containers cannot use, so
        # BuildKit falls back to public resolvers; from the runners those
        # repeatedly fail to resolve download.01.org (the SGX SDK fetch).
        run: |
          set -eu
          dns=$(awk '/^nameserver/ { print $2 }' /run/systemd/resolve/resolv.conf | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "Docker DNS: $dns"
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } \
            | jq --argjson dns "$dns" '. + {dns: $dns}' | sudo tee /etc/docker/daemon.json.new
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          printf 'FROM docker.io/library/busybox:1.37\nRUN cat /etc/resolv.conf && nslookup download.01.org\n' \
            | DOCKER_BUILDKIT=1 docker build --no-cache - || echo "::warning::download.01.org does not resolve in BuildKit"
      - uses: Swatinem/rust-cache@v2
      - name: Build echo-client
        run: cargo build --locked -p echo-client
      - name: Rebuild the enclave, attest the executor, echo through the channel
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/echo-client.log"
          # Defaults: Dockerfile containers/Dockerfile.nix-build, verified
          # TLS, Intel PCS collateral, the Ice Lake SP TCB/advisory policy.
          # Only a failed build is retried (download.01.org intermittently
          # fails to resolve inside the build container on the runners);
          # any verification or channel failure fails the job at once.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/enclave"
            status=0
            target/debug/echo-client --build-output "$RUNNER_TEMP/enclave" \
              -m "Hello, SGX server!" \
              -m "Hello from GitHub Actions run $GITHUB_RUN_ID ($GITHUB_SHA)" \
              2>&1 | tee "$log" || status=$?
            test "$status" -eq 0 && break
            if [ "$attempt" -lt 3 ] && grep -qF '[FAIL] Reproducible build failed' "$log"; then
              echo "::warning::reproducible build failed (attempt $attempt), retrying"
              sleep 60
            else
              exit "$status"
            fi
          done
          for line in \
            "[OK] Quote signature over header and enclave report verified" \
            "is identical to the local build" \
            "[OK] Attested report_data binds the enclave's channel public key" \
            "[OK] Handshake complete" \
            "Reply received from server: Hello from GitHub Actions run $GITHUB_RUN_ID"; do
            grep -qF "$line" "$log" || { echo "::error::missing in client output: $line"; exit 1; }
          done
          test "$(grep -cF '[OK] Echo matches the request' "$log")" -eq 2
          {
            echo '### Live attestation of `sgx-playground.blechschmidt.io:443`'
            echo
            echo "MRENCLAVE (local build): \`$(cat "$RUNNER_TEMP/enclave/out/MRENCLAVE.txt")\`"
            echo
            echo '```'
            grep -E '^\[(OK|WARN|FAIL)\]|TCB|Reply received' "$log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Man-in-the-middle tests (substituted key, tampered records)
        env:
          SGX_RA_E2E_TRANSPORT: tls
        run: |
          SGX_RA_E2E_GENDATA="$RUNNER_TEMP/enclave/out/enclave.so.gendata" \
            cargo test --locked -p echo-client --test e2e -- \
            --ignored --test-threads 1 live_ --skip live_modified_enclave_source_is_rejected
      - name: A modified enclave source is rejected by the live executor
        env:
          SGX_RA_E2E_TRANSPORT: tls
        # Builds the modified source: retried like the build above.
        run: |
          set -eu
          for attempt in 1 2 3; do
            cargo test --locked -p echo-client --test e2e -- \
              --ignored --exact live_modified_enclave_source_is_rejected --nocapture && exit 0
            test "$attempt" -lt 3
            echo "::warning::attempt $attempt failed, retrying"
            sleep 60
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-integration
          path: |
            ${{ runner.temp }}/echo-client.log
            ${{ runner.temp }}/enclave/
          if-no-files-found: ignore
