[package]
name = "sgx-ra-enclave"
description = "Enclave-side (no_std, Intel SGX SDK tRTS) runtime of the sgx-ra framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sgx-ra-core = { workspace = true, features = ["force-soft"] }
zeroize = { workspace = true, features = ["alloc"] }

[features]
# The host-storage OCALLs (`storage::OcallStorage`). The enclave must then be
# linked with `enclave-sys/sealed-storage/Enclave.edl`, whose trusted bridge
# provides them; with the plain `Enclave.edl` the link fails.
sealed-storage = []

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
