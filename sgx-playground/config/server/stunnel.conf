# This configuration file for stunnel sets up a secure TLS tunnel for the SGX Playground service.
# It listens on port 443 and forwards incoming TCP stream data to stdin, outgoing data is forwarded from stdout.

pid = /var/run/stunnel-sgx-playground.pid
foreground = no
debug = info
output = /var/log/stunnel-sgx-playground.log

[sgx-playground]
accept = 0.0.0.0:443
client = no
cert = /etc/letsencrypt/live/sgx-playground.blechschmidt.io/fullchain.pem
key  = /etc/letsencrypt/live/sgx-playground.blechschmidt.io/privkey.pem
exec = /path/to/wrapper.sh
