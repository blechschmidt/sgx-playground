# sgx-ra services. prepare-pccs and pccs are the blueprint's
# (sgx-playground/compose.yaml), unchanged except that their files live in
# sgx-playground/. The rest replaces the blueprint's C++/Python services:
#
#   nix-build  reproducible enclave build (containers/Dockerfile.nix-build);
#              copies enclave.signed.so, gendata, MRENCLAVE.txt, SHA256SUMS
#              into the `enclave` volume
#   host-app   the untrusted Rust host with the enclave, on an SGX machine
#              (profile local-sgx); image from scripts/nix-build-host-image.sh
#   verify-rs  the Rust client: attests the executor against the nix-build
#              output and talks to the enclave over the attested channel
#
# Typical runs (scripts/e2e.sh drives the same steps and the E2E tests):
#
#   docker compose run --rm nix-build              # build, prints MRENCLAVE
#   docker compose run --rm verify-rs              # public executor, Intel PCS
#       (set SGX_RA_PCCS_URL=https://api.trustedservices.intel.com unless
#        the local pccs service runs)
#
#   # On an SGX host: local PCCS + host + client
#   API_KEY=... docker compose up -d pccs
#   scripts/nix-build-host-image.sh
#   docker compose --profile local-sgx up -d host-app
#   SGX_RA_HOST=127.0.0.1 SGX_RA_PORT=7000 SGX_RA_TRANSPORT=--plaintext \
#       docker compose run --rm verify-rs
#
# For the remote executor, stunnel's `exec` runs containers/wrapper.sh (the
# same image and devices as host-app, one container per TLS connection).

name: sgx-ra

services:
  prepare-pccs:
    image: ubuntu:latest
    volumes:
      - ./sgx-playground:/mnt/:rw
      - shared:/shared:rw
    entrypoint: /mnt/scripts/pccs/prepare
    environment:
      API_KEY: ${API_KEY:-}
  pccs:
    depends_on:
      prepare-pccs:
        condition: service_completed_successfully
    volumes:
      - ./sgx-playground/config/pccs/tls/private.pem:/opt/intel/pccs/ssl_key/private.pem
      - ./sgx-playground/config/pccs/tls/file.crt:/opt/intel/pccs/ssl_key/file.crt
      - ./sgx-playground/config/pccs/config.json:/opt/intel/pccs/config/default.json
    build:
      dockerfile: containers/Dockerfile.pccs
      context: ./sgx-playground
    network_mode: host
    ports:
      - "8080:8080"
      - "8081:8081"
    container_name: pccs

  nix-build:
    build:
      context: .
      dockerfile: containers/Dockerfile.nix-build
      # The stage that holds /out (the final stage is `scratch`).
      target: build
      args:
        ENCLAVE: ${SGX_RA_ENCLAVE_ATTR:-enclave}
    image: sgx-ra-nix-build:${SGX_RA_ENCLAVE_ATTR:-enclave}
    volumes:
      - enclave:/export
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -rf /export/*
        cp /out/* /export/
        cd /export
        sha256sum -c SHA256SUMS
        sha256sum enclave.signed.so enclave.so.gendata
        echo "MRENCLAVE $$(cat MRENCLAVE.txt)"

  host-app:
    profiles: [local-sgx]
    # Built by Nix, not by compose: scripts/nix-build-host-image.sh loads it.
    image: ${SGX_RA_HOST_IMAGE:-sgx-ra-echo-host:latest}
    pull_policy: never
    network_mode: host
    devices:
      - /dev/sgx_enclave:/dev/sgx_enclave   # our enclave, QE3, ID enclave
      - /dev/sgx_provision:/dev/sgx_provision  # the PCE
    volumes:
      # QCNL: where the quote provider finds the PCCS (the pccs service).
      - ${SGX_RA_QCNL_CONF:-./config/sgx_default_qcnl.conf}:/etc/sgx_default_qcnl.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # One enclave per TCP connection. Plain TCP on loopback: put stunnel
    # in front of it to expose it (TLS is transport only).
    command: ["--listen", "${SGX_RA_HOST_LISTEN:-127.0.0.1:7000}"]
    restart: unless-stopped

  verify-rs:
    build:
      context: .
      dockerfile: containers/Dockerfile.verify-rs
    image: sgx-ra-verify-rs:latest
    depends_on:
      nix-build:
        condition: service_completed_successfully
    # Host networking: the local PCCS listens on 127.0.0.1:8081, a local
    # host-app on 127.0.0.1:7000.
    network_mode: host
    volumes:
      - enclave:/enclave:ro
      - shared:/shared:ro
    environment:
      SGX_RA_HOST: ${SGX_RA_HOST:-sgx-playground.blechschmidt.io}
      SGX_RA_PORT: ${SGX_RA_PORT:-443}
      SGX_RA_TRANSPORT: ${SGX_RA_TRANSPORT:---insecure-tls}
      SGX_RA_PCCS_URL: ${SGX_RA_PCCS_URL:-https://127.0.0.1:8081}
      # CA of the local PCCS (from prepare-pccs). Set to `none` for a PCCS
      # with a public certificate, e.g. Intel's PCS.
      SGX_RA_PCCS_CA: ${SGX_RA_PCCS_CA:-/shared/ca.crt}

volumes:
  shared:
  enclave:
